- stage: UnitTest
    dependsOn: Build
    jobs:
      - job: UnitTest
        displayName: Unit Test

        pool:
          mobile-westus3-np-agent-pool

        variables:
          build_configuration: ${{ parameters.configuration }}

        steps:
          - checkout: self
            displayName: Code Checkout
            persistCredentials: true

          - script: |
              java -version
            env:
              JAVA_HOME: $(JAVA_HOME_17_X64)

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Bash@3
            displayName: Set global gradle options
            name: gradle
            inputs:
              targetType: 'inline'
              script: |
                set -x
                echo 'setting gradle options ..'
                gradle_options="\
                  --refresh-dependencies \
                  --configure-on-demand \
                  --parallel \
                  --daemon \
                  --max-workers $(grep -c ^processor /proc/cpuinfo) \
                  -Dmaven.wagon.http.pool=false \
                  -Dhttp.keepAlive=false \
                  -Dhttp.socketTimeout=60000 \
                  -Dhttp.connectionTimeout=60000 \
                  -Dorg.gradle.jvmargs=-Xmx7g \
                  -Dorg.gradle.console=verbose \
                  -DaliasPassword=$(keystore_password) \
                  -DkeyStorePassword=$(keystore_password) \
                  -DUSBC_BROWSER_STACK_LIVE_KEY=$(usbc_browser_live_key) \
                  -DUSBC_BROWSER_STACK_LIVE_TOKEN=$(usbc_browser_live_token) \
                  -DUSBC_BROWSER_STACK_MOBILE_PREVIEW_KEY=$(usbc_browser_mobile_preview_key) \
                  -DUSBC_BROWSER_STACK_MOBILE_PREVIEW_TOKEN=$(usbc_browser_mobile_preview_token) \
                  -DCABC_BROWSER_STACK_LIVE_KEY=$(cabc_browser_live_key) \
                  -DCABC_BROWSER_STACK_LIVE_TOKEN=$(cabc_browser_live_token) \
                  -DCABC_BROWSER_STACK_MOBILE_PREVIEW_KEY=$(cabc_browser_mobile_preview_key) \
                  -DCABC_BROWSER_STACK_MOBILE_PREVIEW_TOKEN=$(cabc_browser_mobile_preview_token) \
                  -DDEV_BROWSER_STACK_LIVE_KEY=$(dev_browser_live_key) \
                  -DDEV_BROWSER_STACK_LIVE_TOKEN=$(dev_browser_live_token) \
                  -DDEV_BROWSER_STACK_MOBILE_PREVIEW_KEY=$(dev_browser_mobile_preview_key) \
                  -DDEV_BROWSER_STACK_MOBILE_PREVIEW_TOKEN=$(dev_browser_mobile_preview_token) \
                  -DDEV_BROWSER_STACK_ANDROID_TEST_KEY=$(dev_browser_android_key) \
                  -DDEV_BROWSER_STACK_ANDROID_TEST_TOKEN=$(dev_browser_android_token) \
                  -DTRAINING_STACK_MOBILE_PREVIEW_KEY=$(training_stack_mobile_preview_key) \
                  -DTRAINING_STACK_MOBILE_PREVIEW_TOKEN=$(training_stack_mobile_preview_token) \
                  -DTRAINING_STACK_LIVE_KEY=$(training_stack_live_key) \
                  -DTRAINING_STACK_LIVE_TOKEN=$(training_stack_live_token) \
                  -DWAREHOUSE_CONFIGURATION_KEY=$(warehouse_configuration_key) \
                  -DWAREHOUSE_CONFIGURATION_TOKEN=$(warehouse_configuration_token) \
                  -DBranch=\"$(Build.SourceBranch)\""

                # inject gradle options
                echo "##vso[task.setvariable variable=GRADLE_OPTS]$gradle_options"

          - task: Bash@3
            displayName: Set build tasks
            inputs:
              targetType: 'inline'
              script: |
                #!/bin/bash
                echo 'setting build tasks ..'
                if [[ $(build_configuration) == "release/debug" ]]; then
                  tasks=('test')
                  echo 'test (debug and release) task set'
                elif [[ $(build_configuration) == "release" ]]; then
                  tasks=('testReleaseUnitTest')
                  echo 'testReleaseUnitTest task set'
                else
                  tasks=('testDebugUnitTest')
                  echo 'testDebugUnitTest task set'
                fi
                echo "##vso[task.setvariable variable=GRADLE_TASKS]$(echo ${tasks[@]}|xargs)"

          # execute tests
          - task: Gradle@3
            displayName: Unit Tests
            enabled: true
            inputs:
              testRunTitle: 'Build: $(build_number)'
              gradleWrapperFile: 'gradlew'
              options: '$(GRADLE_OPTS)'
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml'
              tasks: '$(GRADLE_TASKS)'
